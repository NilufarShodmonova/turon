<!DOCTYPE html>
<html lang="uz" class="road-tech-host">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yo'l qurilish texnologiyasi — interaktiv taqdimot</title>
<style>
/* =========================================================================
   YO'L QURILISH TEXNOLOGIYASI — INTERAKTIV TAQDIMOT
   Barcha class nomlari  road-tech-  prefiksi bilan.
   Umumiy selektorlar (button, section, p, h1, *) ishlatilmagan.
   ========================================================================= */
html.road-tech-host{ font-size:clamp(18px, calc(.62vw + .62vh), 34px) }
html.road-tech-host, body.road-tech-host{
  margin:0; padding:0; width:100%; background:#070d18; overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
.road-tech-page{
  --road-tech-primary:#d8b26c;
  --road-tech-primary-light:#f2dda8;
  --road-tech-primary-pale:#b98f45;
  --road-tech-secondary:#e9dcc4;
  --road-tech-background:#070d18;
  --road-tech-background-2:#0b1526;
  --road-tech-surface:#101f38;
  --road-tech-surface-2:#16294a;
  --road-tech-text:#dfd4bf;
  --road-tech-muted:rgba(223,212,191,.66);
  --road-tech-border:rgba(212,175,110,.16);
  --road-tech-line:rgba(212,175,110,.34);
  --road-tech-ok:#8fbf86;
  --road-tech-no:#d08a7e;
  --road-tech-water:#9ec6e8;

  --road-tech-radius:22px;
  --road-tech-radius-btn:12px;
  --road-tech-radius-pill:999px;
  --road-tech-shadow:0 14px 34px rgba(0,0,0,.5);
  --road-tech-shadow-card:0 16px 40px rgba(0,0,0,.6), 0 0 30px rgba(216,178,108,.14);
  --road-tech-container-width:1560px;
  --road-tech-transition:.45s cubic-bezier(.22,.9,.3,1);

  --road-tech-serif:"Trajan Pro","Palatino Linotype","Book Antiqua",Georgia,"Times New Roman",serif;
  --road-tech-sans:"Segoe UI",Tahoma,Verdana,"Helvetica Neue",sans-serif;
  --road-tech-btn-h:4.4em;

  position:relative; width:100%; max-width:100%; margin:0; box-sizing:border-box;
  font-family:var(--road-tech-sans); font-size:1rem; line-height:1.6;
  color:var(--road-tech-text);
  background:
    radial-gradient(130% 95% at 50% 0%, #14263f 0%, #0a1120 58%, #070d18 100%);
  overflow:hidden; -webkit-tap-highlight-color:transparent;
}
.road-tech-page *, .road-tech-page *::before, .road-tech-page *::after{ box-sizing:border-box }
.road-tech-page::before{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:0; opacity:.55;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="520" height="900" viewBox="0 0 520 900"><path d="M60 900 L60 420 A 300 300 0 0 1 260 120 A 300 300 0 0 1 460 420 L460 900" fill="none" stroke="%23e3b25e" stroke-opacity="0.05" stroke-width="2.5"/></svg>');
  background-repeat:no-repeat; background-position:right -60px top 240px;
}

/* =========================  TIPOGRAFIKA  ========================= */
.road-tech-container{ position:relative; z-index:1; width:100%;
  max-width:var(--road-tech-container-width); margin:0 auto; padding:0 clamp(14px,3vw,40px) }
.road-tech-section{ position:relative; z-index:1; padding:clamp(34px,5.2vw,70px) 0 }
.road-tech-section-head{ margin-bottom:clamp(18px,2.6vw,30px) }
.road-tech-eyebrow{ display:block; margin:0 0 .8em; letter-spacing:.3em; font-size:.8rem;
  font-weight:600; color:var(--road-tech-primary-pale); text-transform:uppercase }
.road-tech-heading{ margin:0; font-family:var(--road-tech-serif); font-weight:400;
  font-size:clamp(1.9rem,3.2vw,2.8rem); line-height:1.16; letter-spacing:.12em; text-transform:uppercase;
  background:linear-gradient(180deg,#fdf3d8,#dcb87e 55%,#b98f45);
  -webkit-background-clip:text; background-clip:text; color:transparent }
.road-tech-lead{ margin:1em 0 0; max-width:76ch; font-size:clamp(1rem,1.25vw,1.16rem);
  line-height:1.75; color:var(--road-tech-text) }
.road-tech-lead-strong{ color:var(--road-tech-primary-light); font-weight:600 }
.road-tech-muted{ color:var(--road-tech-muted) }
.road-tech-roadline{ height:8px; margin:0 auto; border-radius:4px; opacity:.35;
  width:calc(100% - 2*clamp(14px,3vw,40px));
  background-image:repeating-linear-gradient(90deg,var(--road-tech-primary) 0 46px,transparent 46px 104px) }

/* =========================  TUGMALAR  ========================= */
.road-tech-btn{ display:inline-flex; align-items:center; justify-content:center; gap:.8em;
  min-height:var(--road-tech-btn-h); padding:0 2.4em; border-radius:var(--road-tech-radius-btn);
  border:1px solid var(--road-tech-line);
  background:linear-gradient(180deg,rgba(22,41,74,.6),rgba(11,21,38,.7));
  color:var(--road-tech-secondary); font-family:var(--road-tech-sans); font-weight:600;
  font-size:1.15rem; letter-spacing:.2em; text-transform:uppercase;
  cursor:pointer; transition:transform .18s, box-shadow .25s, border-color .25s }
.road-tech-btn:hover{ border-color:var(--road-tech-primary); box-shadow:0 0 22px rgba(216,178,108,.18) }
.road-tech-btn:active{ transform:scale(.96) }
.road-tech-btn-primary{ background:linear-gradient(180deg,rgba(216,178,108,.24),rgba(185,143,69,.14));
  color:var(--road-tech-primary-light); border-color:var(--road-tech-primary);
  box-shadow:var(--road-tech-shadow) }
.road-tech-btn-icon{ opacity:.9 }
.road-tech-btn-off{ opacity:.32; pointer-events:none }
.road-tech-btn-icon{ width:1.2em; height:1.2em }
.road-tech-btnrow{ display:flex; gap:1em; flex-wrap:nowrap; align-items:center; margin-top:1.8em }
.road-tech-lang{ display:flex; gap:.7em; flex-wrap:nowrap }
.road-tech-chip{ display:inline-flex; align-items:center; border:1px solid var(--road-tech-line);
  border-radius:8px; background:transparent; color:var(--road-tech-muted); font-weight:600;
  font-size:.9rem; letter-spacing:.2em; text-transform:uppercase; padding:.85em 1.5em;
  cursor:pointer; transition:.25s }
.road-tech-chip:active{ transform:scale(.94) }
.road-tech-chip-on{ background:linear-gradient(180deg,#f2dda8,#b98f45);
  color:var(--road-tech-background); border-color:transparent; font-weight:700 }

/* =========================  HERO  ========================= */
.road-tech-hero{ padding-top:clamp(40px,6vw,86px) }
.road-tech-hero-grid{ display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(20px,3vw,46px);
  align-items:center }
.road-tech-hero-title{ margin:.2em 0 0; font-family:var(--road-tech-serif); font-weight:400;
  font-size:clamp(2.2rem,4.8vw,3.8rem); line-height:1.12; letter-spacing:.1em; text-transform:uppercase;
  background:linear-gradient(180deg,#fdf3d8,#e2c07f 48%,#b98f45);
  -webkit-background-clip:text; background-clip:text; color:transparent }
.road-tech-hero-svg{ width:100%; height:auto; display:block;
  filter:drop-shadow(0 18px 40px rgba(0,0,0,.45)) }

/* =========================  KARTOCHKALAR  ========================= */
.road-tech-cards{ display:grid; gap:clamp(12px,1.1vw,18px) }
.road-tech-cards-3{ grid-template-columns:repeat(3,1fr) }
.road-tech-cards-4{ grid-template-columns:repeat(4,1fr) }
.road-tech-card{ position:relative;
  background:linear-gradient(170deg,rgba(22,41,74,.86),rgba(11,21,38,.92));
  border:1px solid var(--road-tech-line); border-radius:var(--road-tech-radius);
  padding:clamp(16px,1.5vw,24px); transition:box-shadow .25s, transform .12s; overflow:hidden }
.road-tech-card-btn{ cursor:pointer }
.road-tech-card-btn:hover{ box-shadow:var(--road-tech-shadow-card); border-color:rgba(212,175,110,.8) }
.road-tech-card-btn:active{ transform:scale(.985) }
.road-tech-card-on{ border-color:var(--road-tech-primary);
  box-shadow:inset 0 0 0 2px rgba(216,178,108,.28), var(--road-tech-shadow-card) }
.road-tech-card-no{ font-family:var(--road-tech-serif); font-size:1.1rem; letter-spacing:.34em;
  color:var(--road-tech-primary-pale); line-height:1 }
.road-tech-card-title{ margin:.5em 0 0; font-family:var(--road-tech-serif); font-weight:400;
  color:var(--road-tech-primary-light); font-size:clamp(1.15rem,1.6vw,1.45rem); line-height:1.3;
  letter-spacing:.06em; text-transform:uppercase }
.road-tech-card-sub{ margin:.5em 0 0; color:var(--road-tech-primary-pale); font-weight:600;
  font-size:.78rem; letter-spacing:.16em; text-transform:uppercase }
.road-tech-card-text{ margin:.85em 0 0; font-size:.95rem; line-height:1.65; color:var(--road-tech-muted) }

/* =========================  RAQAMLAR  ========================= */
.road-tech-metric{ text-align:center }
.road-tech-metric-val{ font-family:var(--road-tech-serif); font-weight:400; letter-spacing:.04em;
  font-size:clamp(2.2rem,4.2vw,3.4rem); line-height:1;
  background:linear-gradient(180deg,#fdf3d8,#dcb87e 55%,#b98f45);
  -webkit-background-clip:text; background-clip:text; color:transparent }
.road-tech-metric-lab{ margin-top:.7em; color:var(--road-tech-muted); font-weight:600;
  font-size:.82rem; letter-spacing:.14em; text-transform:uppercase }

/* =========================  KESIM QURUVCHI  ========================= */
.road-tech-build{ display:grid; grid-template-columns:1.55fr 1fr; gap:clamp(14px,1.4vw,22px);
  align-items:stretch }
.road-tech-site{ position:relative; border:1px solid var(--road-tech-line);
  border-radius:var(--road-tech-radius); overflow:hidden; padding:.5em;
  background:linear-gradient(180deg,#16283f,#1d3352); min-height:min(56vh,520px) }
.road-tech-site-svg{ width:100%; height:100%; display:block }
.road-tech-st{ animation:road-tech-drop .55s cubic-bezier(.3,1.5,.5,1) both }
@keyframes road-tech-drop{ from{ transform:translateY(-46px); opacity:0 } to{ transform:none; opacity:1 } }
.road-tech-grow{ animation:road-tech-grow-k .6s ease both }
@keyframes road-tech-grow-k{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }
.road-tech-flow{ animation:road-tech-flow-k 1.6s ease-in-out infinite }
@keyframes road-tech-flow-k{ 0%{opacity:0;transform:translateY(-6px)} 35%{opacity:1}
  100%{opacity:0;transform:translateY(16px)} }
.road-tech-lname{ font-family:var(--road-tech-serif); font-size:22px; fill:var(--road-tech-primary-light) }
.road-tech-lsize{ font-family:var(--road-tech-sans); font-size:15px; fill:var(--road-tech-muted); font-weight:700 }
.road-tech-mtxt{ font-family:var(--road-tech-serif); font-size:19px; fill:#e8e2d4; text-anchor:middle }
.road-tech-ruler{ position:absolute; right:1em; top:1em; background:rgba(7,13,24,.82);
  border:1px solid var(--road-tech-line); border-radius:var(--road-tech-radius-pill);
  padding:.4em 1.1em; color:var(--road-tech-primary-pale); font-weight:800; font-size:.78rem }
.road-tech-panel{ background:linear-gradient(170deg,rgba(22,41,74,.86),rgba(11,21,38,.92)); border:1px solid var(--road-tech-line);
  border-radius:var(--road-tech-radius); padding:clamp(16px,1.5vw,24px);
  display:flex; flex-direction:column; gap:.9em }
.road-tech-step{ color:var(--road-tech-primary-pale); font-weight:600; letter-spacing:.24em; text-transform:uppercase;
  font-size:.72rem; text-transform:uppercase }
.road-tech-panel-title{ margin:0; font-family:var(--road-tech-serif); letter-spacing:.06em;
  color:var(--road-tech-primary-light); font-size:clamp(1.25rem,2vw,1.75rem); line-height:1.14 }
.road-tech-why{ background:rgba(11,21,38,.7); border:1px solid var(--road-tech-border);
  border-radius:var(--road-tech-radius-btn); padding:.7em }
.road-tech-why-svg{ width:100%; height:auto; display:block }
.road-tech-wl{ font-family:var(--road-tech-sans); font-size:13px; font-weight:800;
  fill:var(--road-tech-primary-pale); text-anchor:middle }
.road-tech-ws{ font-family:var(--road-tech-sans); font-size:12px; font-weight:700;
  fill:var(--road-tech-muted); text-anchor:middle }
.road-tech-fact{ margin-top:auto; border-top:1px solid var(--road-tech-border); padding-top:.8em }
.road-tech-fact-val{ font-family:var(--road-tech-serif); color:var(--road-tech-primary-light); letter-spacing:.04em;
  font-size:clamp(1.7rem,2.6vw,2.2rem); line-height:1 }
.road-tech-fact-lab{ color:var(--road-tech-muted); font-weight:600; font-size:.78rem;
  letter-spacing:.14em; text-transform:uppercase; margin-top:.45em }
.road-tech-hint{ color:var(--road-tech-no); font-weight:600; font-size:.92rem; min-height:2.4em; letter-spacing:.04em;
  opacity:0; transition:.3s }
.road-tech-hint-on{ opacity:1 }
.road-tech-picks{ display:grid; grid-template-columns:repeat(6,1fr); gap:.7em; margin-top:1em }
.road-tech-pick{ background:linear-gradient(180deg,rgba(22,41,74,.72),rgba(11,21,38,.82));
  border:1px solid var(--road-tech-line);
  border-radius:var(--road-tech-radius-btn); padding:.8em .5em; cursor:pointer; text-align:center }
.road-tech-pick:active{ transform:scale(.96) }
.road-tech-pick-done{ background:linear-gradient(180deg,#8fbf86,#4b7f52); border-color:#b6dcae; pointer-events:none }
.road-tech-pick-done .road-tech-pick-t, .road-tech-pick-done .road-tech-pick-s{ color:#06210c }
.road-tech-pick-bad{ animation:road-tech-shake .4s; border-color:var(--road-tech-no) }
@keyframes road-tech-shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
  40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
.road-tech-pick-ic{ height:26px; margin-bottom:.3em }
.road-tech-pick-ic-svg{ width:100%; height:100%; display:block }
.road-tech-pick-t{ display:block; font-family:var(--road-tech-serif); letter-spacing:.05em;
  color:var(--road-tech-primary-light); font-size:1.1rem; line-height:1.12 }
.road-tech-pick-s{ display:block; font-size:.72rem; color:var(--road-tech-muted);
  margin-top:.25em; font-weight:700 }
.road-tech-done-note{ margin-top:1em; border:1.5px dashed var(--road-tech-ok);
  border-radius:var(--road-tech-radius-btn); padding:1em 1.2em; color:var(--road-tech-secondary);
  display:none }
.road-tech-done-note-on{ display:block; animation:road-tech-grow-k .5s both }

/* =========================  QATLAMLAR RO'YXATI  ========================= */
.road-tech-rows{ display:flex; flex-direction:column; gap:.45em }
.road-tech-row{ display:flex; align-items:center; gap:1em; padding:.85em 1em;
  border:1px solid var(--road-tech-border); border-left:3px solid var(--road-tech-primary-pale);
  border-radius:10px;
  background:linear-gradient(160deg,rgba(22,41,74,.66),rgba(11,21,38,.82));
  cursor:pointer; transition:.25s }
.road-tech-row:hover{ border-color:var(--road-tech-primary) }
.road-tech-row-on{ border-color:var(--road-tech-primary);
  border-left-color:var(--road-tech-primary-light);
  box-shadow:inset 0 0 0 2px rgba(216,178,108,.24) }
.road-tech-row-no{ width:2em; height:2em; flex-shrink:0; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-family:var(--road-tech-serif);
  font-size:1.05rem; color:var(--road-tech-background); font-weight:700 }
.road-tech-row-body{ min-width:0; flex:1 }
.road-tech-row-n{ font-family:var(--road-tech-serif); color:var(--road-tech-primary-light);
  font-size:1.08rem; line-height:1.25; letter-spacing:.05em; display:block }
.road-tech-row-p{ color:var(--road-tech-muted); font-size:.78rem; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; display:block }
.road-tech-row-s{ margin-left:auto; flex-shrink:0; color:var(--road-tech-primary);
  font-family:var(--road-tech-serif); font-size:.95rem; letter-spacing:.08em }

/* =========================  BIR KUN  ========================= */
.road-tech-day-scene{ border:1px solid var(--road-tech-line);
  border-radius:var(--road-tech-radius); overflow:hidden; background:#0a1424 }
.road-tech-day-svg{ width:100%; height:auto; display:block }
.road-tech-day-bar{ display:flex; gap:.7em; flex-wrap:wrap; margin-top:1em; align-items:center }
.road-tech-day-time{ margin-left:auto; font-family:var(--road-tech-serif);
  color:var(--road-tech-primary-light); font-size:1.5rem; letter-spacing:.1em }

/* =========================  QOPLAMA SOLISHTIRISH  ========================= */
.road-tech-cut2{ display:flex; height:2.8em; border-radius:6px; overflow:hidden;
  border:1px solid rgba(0,0,0,.45); margin-top:.9em }
.road-tech-cut2-l{ flex:1 }

@media (max-width:1200px){
  .road-tech-hero-grid{ grid-template-columns:1fr }
  .road-tech-build{ grid-template-columns:1fr }
  .road-tech-cards-3,.road-tech-cards-4{ grid-template-columns:1fr 1fr }
  .road-tech-picks{ grid-template-columns:repeat(3,1fr) }
}
@media (max-width:620px){
  .road-tech-cards-3,.road-tech-cards-4{ grid-template-columns:1fr }
  .road-tech-picks{ grid-template-columns:1fr 1fr }
  .road-tech-btn{ min-height:3.4em; padding:0 1.4em; letter-spacing:.14em }
}

@media (min-width: 2500px) {
  html.road-tech-host { font-size: clamp(24px, calc(0.7vw + 0.7vh), 42px); }
  .road-tech-page { --road-tech-container-width: 2600px; }
}

</style>
</head>
<body class="road-tech-host">
<div class="road-tech-page" id="road-tech-page">

<svg width="0" height="0" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
  <linearGradient id="road-tech-gg" x1="0" y1="0" x2="0" y2="1">

     fill="none" stroke="url(#road-tech-gg)" stroke-width="9" stroke-linecap="round"/></g>

  <g id="road-tech-i-hand"><path fill="currentColor" d="M9 11V4a1.5 1.5 0 013 0v6h1V6a1.5 1.5 0 013 0v5h1V8a1.5 1.5 0 013 0v7a6 6 0 01-6 6h-1.6a6 6 0 01-4.6-2.2L4.3 14a1.6 1.6 0 012.4-2l1.3 1.5z"/></g>

<!-- ================= HERO ================= -->
<section class="road-tech-section road-tech-hero" id="road-tech-intro">
  <div class="road-tech-container">
    <div class="road-tech-hero-grid">
      <div>
        <span class="road-tech-eyebrow" id="road-tech-hero-eyebrow">Interaktiv taqdimot</span>
        <h2 class="road-tech-hero-title" id="road-tech-hero-title">YO'L QURILISH TEXNOLOGIYASI</h2>
        <p class="road-tech-lead" id="road-tech-hero-lead"></p>
        <div class="road-tech-btnrow">
          <button class="road-tech-btn road-tech-btn-primary" id="road-tech-go">
            <svg class="road-tech-btn-icon" viewBox="0 0 24 24"><use href="#road-tech-i-hand"/></svg>
            <span id="road-tech-go-t"></span></button>
          <button class="road-tech-btn" id="road-tech-snd">
            <svg class="road-tech-btn-icon" viewBox="0 0 24 24"><use href="#road-tech-i-sound"/></svg>
            <span id="road-tech-snd-t"></span></button>
          <span class="road-tech-lang">
            <span class="road-tech-chip road-tech-chip-on" data-lang="uz">O'ZB</span>
            <span class="road-tech-chip" data-lang="ru">РУС</span>
            <span class="road-tech-chip" data-lang="en">ENG</span>
          </span>
        </div>
      </div>
      <div>
        <svg class="road-tech-hero-svg" viewBox="0 0 720 380" id="road-tech-hero-svg"></svg>
      </div>
    </div>
  </div>
</section>
<div class="road-tech-roadline"></div>

<!-- ================= 1 · TRASSA ================= -->
<section class="road-tech-section" id="road-tech-route">
  <div class="road-tech-container">
    <div class="road-tech-section-head">
      <span class="road-tech-eyebrow" data-t="e1"></span>
      <h2 class="road-tech-heading" data-t="h1"></h2>
      <p class="road-tech-lead" data-t="l1"></p>
    </div>
    <div class="road-tech-cards road-tech-cards-4" id="road-tech-route-cards"></div>
  </div>
</section>


<!-- ================= 2 · QATLAMLAR TARTIBI ================= -->
<section class="road-tech-section" id="road-tech-order">
  <div class="road-tech-container">
    <div class="road-tech-section-head">
      <span class="road-tech-eyebrow" data-t="e2"></span>
      <h2 class="road-tech-heading" data-t="h2"></h2>
      <p class="road-tech-lead" data-t="l2"></p>
    </div>

   1. YORDAMCHI: prosedural toshlar
   ========================================================================= */
function roadTechRng(seed){ let s=seed||1; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function roadTechStone(cx,cy,r,rng,k){
  const n=k||6, pts=[];
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+(rng()-.5)*.45, rr=r*(.60+rng()*.52);
    pts.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr*.8]); }
  return 'M'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')+'Z';
}
function roadTechSlab(x,y,w,h,rng){ const j=()=>(rng()-.5)*w*.10;
  return `M${(x+j()).toFixed(1)},${(y+j()).toFixed(1)}L${(x+w+j()).toFixed(1)},${(y+j()).toFixed(1)}`+
         `L${(x+w+j()).toFixed(1)},${(y+h+j()).toFixed(1)}L${(x+j()).toFixed(1)},${(y+h+j()).toFixed(1)}Z`; }
function roadTechShade(hex,k){ const n=parseInt(hex.slice(1),16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.min(255,Math.max(0,v+k)));
  return '#'+((c[0]<<16)|(c[1]<<8)|c[2]).toString(16).padStart(6,'0'); }
function roadTechFill(x0,x1,y0,y1,size,color,seed,kind){
  const rng=roadTechRng(seed), out=[]; const CAP=260; let i=0;
  if(kind==='slab'){ const w=size*2.1, h=y1-y0;
    for(let x=x0;x<x1-4;x+=w+2) out.push({d:roadTechSlab(x,y0,Math.min(w,x1-x-2),h-2,rng),
      f:roadTechShade(color,Math.round((rng()-.5)*26)), i:i++});
    return out; }
  const rows=Math.max(1,Math.round((y1-y0)/(size*1.35)));
  for(let r=0;r<rows;r++){
    const cy=y0+size*.8+r*((y1-y0-size*.5)/Math.max(1,rows-.001)), step=size*1.55;
    for(let cx=x0+size*.7+(r%2?step*.5:0); cx<x1-size*.4; cx+=step*(.86+rng()*.3)){
      if(out.length>=CAP) return out;
      out.push({d:roadTechStone(cx+(rng()-.5)*size*.4, cy+(rng()-.5)*size*.35,
        size*(.72+rng()*.55), rng, 5+Math.floor(rng()*3)),
        f:roadTechShade(color,Math.round((rng()-.5)*34)), i:i++}); } }
  return out;
}

let AC=null,M=null,sndOn=true;
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)();
  M=AC.createGain(); M.gain.value=.6; M.connect(AC.destination); }
  if(AC.state==='suspended') AC.resume(); return AC; }
function gravelSound(){
  if(!sndOn) return;
  try{ const a=ac(), t=a.currentTime, D=.7;
    const n=a.createBufferSource(), len=Math.round(a.sampleRate*D);
    const b=a.createBuffer(1,len,a.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.6);
    n.buffer=b;
    const f=a.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2400; f.Q.value=.8;
    const g=a.createGain(); g.gain.setValueAtTime(.0001,t);
    g.gain.linearRampToValueAtTime(.5,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+D);
    n.connect(f); f.connect(g); g.connect(M); n.start(t); n.stop(t+D+.05);
    for(let i=0;i<14;i++){ const tt=t+Math.random()*D*.8, o=a.createOscillator(), og=a.createGain();
      o.type='triangle'; o.frequency.value=800+Math.random()*1800;
      og.gain.setValueAtTime(.0001,tt); og.gain.exponentialRampToValueAtTime(.22,tt+.003);
      og.gain.exponentialRampToValueAtTime(.0001,tt+.05);
      o.connect(og); og.connect(M); o.start(tt); o.stop(tt+.06); }
  }catch(e){}
}
function thudSound(){
  if(!sndOn) return;
  try{ const a=ac(), t=a.currentTime, o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(45,t+.18);
    g.gain.setValueAtTime(.5,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(g); g.connect(M); o.start(t); o.stop(t+.32);
  }catch(e){}
}

   <linearGradient id="road-tech-soil2" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="#4a3d2c"/><stop offset="1" stop-color="#241d14"/></linearGradient>
   <linearGradient id="road-tech-grass2" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="#4a5c34"/><stop offset="1" stop-color="#33421f"/></linearGradient></defs>
   <rect x="0" y="${ground}" width="${W}" height="${H-ground}" fill="url(#road-tech-soil2)"/>
   <rect x="0" y="${ground-16}" width="${W}" height="18" fill="url(#road-tech-grass2)"/>
   <rect x="${x0}" y="${ground}" width="${x1-x0}" height="${floor-ground}" fill="#1a140d"/>`;
  const solid=RT_STEPS.filter(x=>x.h>0), total=solid.reduce((a,b)=>a+b.h,0), hpx=floor-ground;
  let acc=0; const bands=[];
  solid.forEach((st,idx)=>{ const hh=hpx*st.h/total;
    bands.push({st,idx,y1:floor-acc,y0:floor-acc-hh}); acc+=hh; });
  bands.forEach(({st,idx,y0,y1})=>{
    const on = ordSel===idx, dim = ordSel>=0 && !on;
    s+=`<g opacity="${dim?.34:1}">`;
    roadTechFill(x0+4,x1-4,y0,y1,st.size,st.c,idx*997+13,st.kind).forEach(p=>{
      s+=`<path d="${p.d}" fill="${p.f}" stroke="#1a140d" stroke-width="1.1"/>`; });
    s+=`</g>`;
    /* номер слоя кружком слева */
    s+=`<circle cx="${x0-44}" cy="${(y0+y1)/2}" r="17" fill="${on?'#e3b25e':'#16283f'}"
          stroke="${on?'#f0d9a8':'#3d5474'}" stroke-width="${on?3:2}"/>
        <text x="${x0-44}" y="${(y0+y1)/2+7}" text-anchor="middle"
          style="font-family:var(--road-tech-serif);font-size:19px;font-weight:700;
                 fill:${on?'#0c1728':'#9fb0c8'}">${idx+1}</text>`;
    if(on) s+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="none"
                 stroke="#f0d9a8" stroke-width="3"/>`;
    s+=`<text class="road-tech-lname" x="${x1+14}" y="${(y0+y1)/2+3}"
          opacity="${dim?.45:1}">${st.n[lang].split('—')[0].trim()}</text>
        <text class="road-tech-lsize" x="${x1+14}" y="${(y0+y1)/2+22}"
          opacity="${dim?.45:1}">${st.sz[lang]}</text>`;
  });
  const topY=bands[bands.length-1].y0;
  const wsel = ordSel===RT_STEPS.length-1;
  s+=`<g opacity="${ordSel>=0&&!wsel?.45:1}">
      <path d="M${x0} ${topY} Q${(x0+x1)/2} ${topY-30} ${x1} ${topY} L${x1} ${topY+10} L${x0} ${topY+10} Z"
        fill="#8d8378" stroke="#1a140d" stroke-width="1.2"/>
      <path d="M${x0-88} ${ground} q30 62 60 0 z" fill="#0f1a26" stroke="#5c7385" stroke-width="2"/>
      <path d="M${x1+28} ${ground} q30 62 60 0 z" fill="#0f1a26" stroke="#5c7385" stroke-width="2"/></g>`;
  if(wsel) for(let i=0;i<5;i++){ const px=(x0+x1)/2+(i-2)*70, dir=(i-2)<0?-1:1;
    s+=`<path class="road-tech-flow" d="M${px} ${topY-34} l${dir*46} 30" stroke="#8fb3d9"
         stroke-width="3" fill="none" stroke-linecap="round" style="animation-delay:${i*130}ms"/>`; }
  s+=`<circle cx="${x0-44}" cy="${topY-26}" r="17" fill="${wsel?'#e3b25e':'#16283f'}"
        stroke="${wsel?'#f0d9a8':'#3d5474'}" stroke-width="${wsel?3:2}"/>
      <text x="${x0-44}" y="${topY-19}" text-anchor="middle"
        style="font-family:var(--road-tech-serif);font-size:19px;font-weight:700;
               fill:${wsel?'#0c1728':'#9fb0c8'}">6</text>`;
  document.getElementById('road-tech-order-svg').innerHTML=s;

  const st=RT_STEPS[ordSel];
  document.getElementById('road-tech-order-rows').innerHTML=RT_STEPS.map((x,i)=>`
    <div class="road-tech-row ${i===ordSel?'road-tech-row-on':''}" data-o="${i}">
      <span class="road-tech-row-no" style="background:${i===ordSel?'#e3b25e':x.c};
        color:${i===ordSel?'#0c1728':'#f5eedf'}">${i+1}</span>
      <span class="road-tech-row-body">
        <span class="road-tech-row-n">${x.n[lang].split('—')[0].trim()}</span>
        <span class="road-tech-row-p">${x.pur[{uz:0,ru:1,en:2}[lang]]}</span></span>
      <span class="road-tech-row-s">${x.sz[lang]}</span></div>`).join('');
  Array.from(document.querySelectorAll('#road-tech-order-rows .road-tech-row')).forEach(el=>
    el.addEventListener('click',()=>{ ordSel=+el.dataset.o; drawOrder(); }));
  document.getElementById('road-tech-order-why').innerHTML =
    WHY[st.id]? WHY[st.id](st.why.map(x=>x.split('|')[{uz:0,ru:1,en:2}[lang]])) : '';
  document.getElementById('road-tech-order-text').textContent=st.d[lang];
}

/* --- kesim chizish --- */
function drawSite(){
  const W=900,H=560,x0=120,x1=780,ground=170,floor=520;
  let s=`<defs>
   <linearGradient id="road-tech-soil" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="#4a3d2c"/><stop offset="1" stop-color="#241d14"/></linearGradient>
   <linearGradient id="road-tech-grass" x1="0" y1="0" x2="0" y2="1">
     <stop offset="0" stop-color="#4a5c34"/><stop offset="1" stop-color="#33421f"/></linearGradient></defs>
   <rect x="0" y="${ground}" width="${W}" height="${H-ground}" fill="url(#road-tech-soil)"/>
   <rect x="0" y="${ground-16}" width="${W}" height="18" fill="url(#road-tech-grass)"/>
   <rect x="${x0}" y="${ground}" width="${x1-x0}" height="${floor-ground}" fill="#1a140d"/>`;
  const solid=RT_STEPS.filter(x=>x.h>0), total=solid.reduce((a,b)=>a+b.h,0), hpx=floor-ground;
  let acc=0; const bands=[];
  solid.forEach((st,idx)=>{ const hh=hpx*st.h/total;
    bands.push({st,idx,y1:floor-acc,y0:floor-acc-hh}); acc+=hh; });
  const lastIdx = placed.length? placed[placed.length-1] : -1;
  bands.forEach(({st,idx,y0,y1})=>{
    if(!placed.includes(idx)) return;
    const fresh=idx===lastIdx;
    roadTechFill(x0+4,x1-4,y0,y1,st.size,st.c,idx*997+13,st.kind).forEach(p=>{
      s+=`<path class="${fresh?'road-tech-st':''}" d="${p.d}" fill="${p.f}" stroke="#1a140d" stroke-width="1.1"
           ${fresh?`style="animation-delay:${Math.min(p.i*7,520)}ms"`:''}/>`; });
    s+=`<text class="road-tech-lname" x="${x1+12}" y="${(y0+y1)/2+5}">${st.n[lang].split('—')[0].trim()}</text>
        <text class="road-tech-lsize" x="${x1+12}" y="${(y0+y1)/2+24}">${st.sz[lang]}</text>`;
  });
  const topY = bands.length? bands[bands.length-1].y0 : floor;
  if(placed.length>=5)
    s+=`<rect x="${x0-26}" y="${topY-6}" width="26" height="${floor-topY+6}" fill="#6b665c" stroke="#1a140d" stroke-width="1.2"/>
        <rect x="${x1}" y="${topY-6}" width="26" height="${floor-topY+6}" fill="#6b665c" stroke="#1a140d" stroke-width="1.2"/>`;
  if(placed.includes(RT_STEPS.length-1)){
    s+=`<path class="road-tech-grow" d="M${x0} ${topY} Q${(x0+x1)/2} ${topY-30} ${x1} ${topY} L${x1} ${topY+10} L${x0} ${topY+10} Z" fill="#8d8378" stroke="#1a140d" stroke-width="1.2"/>`;
    [x0-58,x1+58].forEach(cx=>{ s+=`<path class="road-tech-grow" d="M${cx-30} ${ground} q30 62 60 0 z" fill="#0f1a26" stroke="#5c7385" stroke-width="2"/>`; });
    for(let i=0;i<5;i++){ const px=(x0+x1)/2+(i-2)*70, dir=(i-2)<0?-1:1;
      s+=`<path class="road-tech-flow" d="M${px} ${topY-34} l${dir*46} 30" stroke="#8fb3d9" stroke-width="3" fill="none" stroke-linecap="round" style="animation-delay:${i*130}ms"/>`; }
    s+=`<g class="road-tech-grow"><rect x="${x0-120}" y="${ground-92}" width="34" height="92" rx="4" fill="#5c6472" stroke="#1a140d" stroke-width="1.5"/>
        <text x="${x0-103}" y="${ground-58}" class="road-tech-mtxt">XV</text></g>`;
  }
  $('#road-tech-site-svg').innerHTML=s;
}
function fracIcon(st){
  if(st.kind==='earth') return `<svg class="road-tech-pick-ic-svg" viewBox="0 0 60 26"><path d="M4 20 q12 -12 26 0 t26 0" fill="none" stroke="#8a7c63" stroke-width="4"/></svg>`;
  if(st.kind==='none')  return `<svg class="road-tech-pick-ic-svg" viewBox="0 0 60 26"><path d="M6 18 q24 -14 48 0" fill="none" stroke="#8fb3d9" stroke-width="3"/><path d="M18 8 l-8 8 M42 8 l8 8" stroke="#8fb3d9" stroke-width="3"/></svg>`;
  const rng=roadTechRng(st.size*31+5); let g='';
  if(st.kind==='slab'){ for(let i=0;i<3;i++) g+=`<path d="${roadTechSlab(4+i*19,5,16,16,rng)}" fill="${st.c}" stroke="#1a140d" stroke-width="1"/>`; }
  else { const r=st.size<8?2.6:st.size<13?4.6:7.5;
    for(let i=0;i<Math.round(58/(r*2.1));i++)
      g+=`<path d="${roadTechStone(6+i*r*2.2,13+(i%2?3:-3),r,rng,6)}" fill="${roadTechShade(st.c,Math.round((rng()-.5)*30))}" stroke="#1a140d" stroke-width=".9"/>`; }
  return `<svg class="road-tech-pick-ic-svg" viewBox="0 0 60 26">${g}</svg>`;
}
function drawPanel(){
  const n=placed.length, last = n? RT_STEPS[placed[n-1]] : null;
  $('#road-tech-stepno').textContent=`${Math.min(n+1,RT_STEPS.length)} / ${RT_STEPS.length}`;
  if(last){
    $('#road-tech-steptitle').textContent=last.t[lang];
    $('#road-tech-whybox').innerHTML=WHY[last.id]? WHY[last.id](last.why.map(x=>x.split('|')[{uz:0,ru:1,en:2}[lang]])) : '';
    $('#road-tech-steptext').textContent=last.d[lang];
    $('#road-tech-factval').textContent=last.f[0];
    $('#road-tech-factlab').textContent=tx(last.f[1]);
  } else {
    $('#road-tech-steptitle').textContent=tr('pick');
    $('#road-tech-whybox').innerHTML='';
    $('#road-tech-steptext').textContent=tr('intro');
    $('#road-tech-factval').textContent='—'; $('#road-tech-factlab').textContent='';
  }
  $('#road-tech-hint').textContent = bad!==null? tr('wrong'):'';
  $('#road-tech-hint').classList.toggle('road-tech-hint-on', bad!==null);
  $('#road-tech-donenote').textContent=tr('done');
  $('#road-tech-donenote').classList.toggle('road-tech-done-note-on', n===RT_STEPS.length);
}
function drawPicks(){
  $('#road-tech-picks').innerHTML=order.map(i=>{
    const st=RT_STEPS[i], on=placed.includes(i);
    return `<div class="road-tech-pick ${on?'road-tech-pick-done':''} ${bad===i?'road-tech-pick-bad':''}" data-i="${i}">
      <div class="road-tech-pick-ic">${fracIcon(st)}</div>
      <span class="road-tech-pick-t">${st.n[lang].split('—')[0].trim()}</span>
      <span class="road-tech-pick-s">${st.sz[lang]}</span></div>`; }).join('');
  $$('#road-tech-picks .road-tech-pick').forEach(el=>el.addEventListener('click',()=>place(+el.dataset.i)));
}
function place(i){
  if(placed.includes(i)) return;
  if(i===placed.length){ placed.push(i); bad=null; gravelSound();
    if(i===RT_STEPS.length-1) thudSound(); }
  else { bad=i; setTimeout(()=>{ bad=null; drawPicks(); drawPanel(); },700); }
  drawSite(); drawPicks(); drawPanel();
}
function resetGame(){ placed=[]; bad=null;
  order=RT_STEPS.map((_,i)=>i).sort(()=>Math.random()-.5);
  drawSite(); drawPicks(); drawPanel(); }

/* --- hero sahna --- */
function drawHero(){
  const rng=roadTechRng(3); let s='';
  s+=`<rect x="0" y="0" width="720" height="380" fill="none"/>`;
  s+=`<rect x="0" y="250" width="720" height="130" fill="#3a3228"/>`;
  s+=`<rect x="0" y="242" width="720" height="12" fill="#4a5c34"/>`;
  const bands=[['#5f5a50',18,300],['#7d7466',12,282],['#a09482',9,264],['#8d8378',16,248]];
  let y=300;
  bands.forEach(([c,sz,yy],bi)=>{
    const arr = bi===3 ? roadTechFill(70,650,yy-18,yy,sz,c,900+bi,'slab')
                       : roadTechFill(70,650,yy-18,yy,sz,c,900+bi,'rock');
    arr.forEach(p=>{ s+=`<path d="${p.d}" fill="${p.f}" stroke="#1a140d" stroke-width="1"/>`; });
  });
  s+=`<path d="M70 230 Q360 206 650 230 L650 244 L70 244 Z" fill="#8d8378" stroke="#1a140d" stroke-width="1.4"/>`;
  s+=`<rect x="44" y="224" width="26" height="80" fill="#6b665c" stroke="#1a140d" stroke-width="1.2"/>`;
  s+=`<rect x="650" y="224" width="26" height="80" fill="#6b665c" stroke="#1a140d" stroke-width="1.2"/>`;
  for(let i=0;i<4;i++){ const px=360+(i-1.5)*90, dir=(i-1.5)<0?-1:1;
    s+=`<path class="road-tech-flow" d="M${px} 196 l${dir*44} 28" stroke="#8fb3d9" stroke-width="3.2"
         fill="none" stroke-linecap="round" style="animation-delay:${i*150}ms"/>`; }
  s+=`<g><rect x="8" y="150" width="30" height="86" rx="4" fill="#5c6472" stroke="#1a140d" stroke-width="1.4"/>
      <text x="23" y="184" class="road-tech-mtxt">XV</text></g>`;
  s+=`<g transform="translate(500,44) scale(.62)"><use href="#road-tech-i-arch"/></g>`;
  $('#road-tech-hero-svg').innerHTML=s;
}

/* --- «bir kun» sahnasi --- */
function drawDay(){
  const d=RT_DAY[day], sun=d.sun;
  const sky1=`hsl(${210-sun*30} 45% ${8+sun*22}%)`, sky2=`hsl(${28+sun*10} ${40+sun*20}% ${14+sun*28}%)`;
  let s=`<defs><linearGradient id="road-tech-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs>
    <rect x="0" y="0" width="900" height="300" fill="url(#road-tech-sky)"/>
    <circle cx="${90+sun*720}" cy="${226-Math.sin(sun*Math.PI)*168}" r="26"
      fill="#f0d9a8" opacity="${.35+sun*.5}"/>
    <rect x="0" y="212" width="900" height="88" fill="#3a3228"/>
    <rect x="0" y="204" width="900" height="10" fill="#4a5c34"/>`;
  /* uchastka: qadamga qarab qatlamlar to'planadi */
  const lv=[0,0,3,4,5][day];
  const cols=['#5f5a50','#7d7466','#a09482','#8d8378'];
  for(let i=0;i<Math.max(0,lv-1);i++)
    s+=`<rect x="240" y="${236-i*10}" width="420" height="10" fill="${cols[Math.min(i,3)]}" stroke="#1a140d" stroke-width="1"/>`;
  if(day>=1) s+=`<rect x="240" y="236" width="420" height="26" fill="#1a140d"/>`;
  if(day>=4){
    s+=`<path d="M240 ${236-4*10} Q450 ${228-4*10} 660 ${236-4*10} l0 8 l-420 0 z" fill="#8d8378" stroke="#1a140d"/>`;
    s+=`<rect x="150" y="150" width="22" height="62" rx="3" fill="#5c6472" stroke="#1a140d"/>`;
  }
  /* qoziqlar va arqon — razbivka */
  if(day===0){ for(let i=0;i<7;i++){ const x=250+i*68;
    s+=`<rect x="${x}" y="192" width="4" height="22" fill="#8a7c63"/>`; }
    s+=`<path d="M250 194 L660 194" stroke="#f0d9a8" stroke-width="1.6" stroke-dasharray="7 6"/>`; }
  /* ishchilar — oddiy siluetlar */
  const men=[[300,day],[420,day],[540,day]];
  men.forEach(([x],i)=>{
    const yy=206, t=(day+i)%2? 1:-1;
    s+=`<g transform="translate(${x},${yy})">
      <circle cx="0" cy="-34" r="6" fill="#d8c29a"/>
      <path d="M0 -28 L0 -12 M0 -12 L-6 0 M0 -12 L6 0" stroke="#d8c29a" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <path d="M0 -24 L${t*12} ${-18+t*4}" stroke="#d8c29a" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M${t*12} ${-18+t*4} L${t*22} ${-6+t*2}" stroke="#8a7c63" stroke-width="3" stroke-linecap="round"/></g>`;
  });
  $('#road-tech-day-svg').innerHTML=s;
  $('#road-tech-day-title').textContent=d.n[lang];
  $('#road-tech-day-text').textContent=d.d[lang];
  $('#road-tech-day-time').textContent=d.time;
  $('#road-tech-day-prev').classList.toggle('road-tech-btn-off', day===0);
  $('#road-tech-day-next').classList.toggle('road-tech-btn-off', day===RT_DAY.length-1);
}

/* --- kartochkalar --- */
function cutStrip(cols){ return `<div class="road-tech-cut2">${cols.map(c=>`<i class="road-tech-cut2-l" style="background:${c}"></i>`).join('')}</div>`; }
function drawCards(){
  $('#road-tech-route-cards').innerHTML=RT_ROUTE.map((x,i)=>`
    <div class="road-tech-card"><div class="road-tech-card-no">${String(i+1).padStart(2,'0')}</div>
      <h3 class="road-tech-card-title">${x.n[lang]}</h3>
      <div class="road-tech-card-sub">${x.s[lang]}</div>
      <p class="road-tech-card-text">${x.d[lang]}</p></div>`).join('');

  $('#road-tech-mat-cards').innerHTML=RT_MAT.map((x,i)=>`
    <div class="road-tech-card road-tech-card-btn ${matOpen===i?'road-tech-card-on':''}" data-m="${i}">
      <div class="road-tech-pick-ic" style="height:32px">${fracIcon({kind:x.kind||(x.size?'rock':'earth'),size:x.size||10,c:x.c})}</div>
      <h3 class="road-tech-card-title">${x.n[lang]}</h3>
      <p class="road-tech-card-text">${matOpen===i? x.d[lang] : ''}</p>
      ${matOpen===i?'':`<div class="road-tech-card-sub">${tr('pick')==null?'':'?'}</div>`}</div>`).join('');
  $$('#road-tech-mat-cards .road-tech-card-btn').forEach(el=>el.addEventListener('click',()=>{
    matOpen = matOpen===+el.dataset.m? -1 : +el.dataset.m; drawCards(); }));

  $('#road-tech-num-cards').innerHTML=RT_NUM.map(([v,l])=>`
    <div class="road-tech-card road-tech-metric">
      <div class="road-tech-metric-val">${v}</div>
      <div class="road-tech-metric-lab">${tx(l)}</div></div>`).join('');

  $('#road-tech-tool-cards').innerHTML=RT_TOOLS.map(x=>`
    <div class="road-tech-card"><h3 class="road-tech-card-title">${x.n[lang]}</h3>
      <div class="road-tech-card-sub">${x.s[lang]}</div>
      <p class="road-tech-card-text">${x.d[lang]}</p></div>`).join('');

  $('#road-tech-cmp-cards').innerHTML=RT_CMP.map(x=>`
    <div class="road-tech-card"><h3 class="road-tech-card-title">${x.n[lang]}</h3>
      <div class="road-tech-card-sub">${x.y[lang]}</div>
      <p class="road-tech-card-text">${x.d[lang]}</p>${cutStrip(x.cut)}</div>`).join('');

  $('#road-tech-leg-cards').innerHTML=RT_LEG.map(x=>`
    <div class="road-tech-card"><h3 class="road-tech-card-title">${x.n[lang]}</h3>
      <p class="road-tech-card-text">${x.d[lang]}</p>${cutStrip(x.cut)}</div>`).join('');
}
function drawTexts(){
  $$('[data-t]').forEach(el=>{ el.textContent=tr(el.dataset.t); });
  $('#road-tech-hero-lead').textContent=tr('lead');
  $('#road-tech-go-t').textContent=tr('go');
  $('#road-tech-snd-t').textContent=tr('snd');
}
function renderAll(){ drawTexts(); drawCards(); drawOrder(); drawSite(); drawPicks(); drawPanel(); drawDay(); }

/* --- hodisalar --- */
$$('.road-tech-chip').forEach(el=>el.addEventListener('click',()=>{
  lang=el.dataset.lang;
  $$('.road-tech-chip').forEach(c=>c.classList.toggle('road-tech-chip-on', c===el));
  renderAll(); }));
$('#road-tech-go').addEventListener('click',()=>{ ac();
  document.getElementById('road-tech-cut').scrollIntoView({behavior:'smooth',block:'start'}); });
$('#road-tech-snd').addEventListener('click',()=>{ sndOn=!sndOn;
  $('#road-tech-snd').style.opacity=sndOn?1:.5; if(sndOn){ ac(); gravelSound(); } });
$('#road-tech-again').addEventListener('click',resetGame);
$('#road-tech-toGame').addEventListener('click',()=>{ ac();
  document.getElementById('road-tech-cut').scrollIntoView({behavior:'smooth',block:'start'}); });
$('#road-tech-day-prev').addEventListener('click',()=>{ if(day>0){day--; drawDay();} });
$('#road-tech-day-next').addEventListener('click',()=>{ if(day<RT_DAY.length-1){day++; drawDay();} });

drawHero(); resetGame(); renderAll();
})();
</script>

.tp-tool-btn {
  padding: 0.75rem 1.65rem; border: 1px solid rgba(212, 175, 110, 0.45); border-radius: 0.85rem;
  font-size: 1.2rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; color: #e9dcc4;
  background: rgba(16, 31, 56, 0.8); cursor: pointer; transition: all 0.25s;
  display: flex; align-items: center; gap: 0.7rem; text-decoration: none;
}
.tp-tool-btn:hover, .tp-tool-btn.is-active, .tp-tool-btn.road-tech-chip-on {
  color: #070d18; background: linear-gradient(180deg, #f3e2b8, #b98f45);
  border-color: transparent; font-weight: 700; box-shadow: 0 4px 18px rgba(216, 178, 108, 0.45);
}
.tp-tool-icon {
  width: 3.8rem; height: 3.8rem; border: 1px solid rgba(212, 175, 110, 0.45); border-radius: 0.85rem;
  display: flex; align-items: center; justify-content: center; background: rgba(16, 31, 56, 0.8);
  cursor: pointer; transition: all 0.25s; text-decoration: none;
}
.tp-tool-icon svg { width: 2.2rem; height: 2.2rem; stroke: #d8b26c; fill: none; stroke-width: 2.2; }
.tp-tool-icon:hover { border-color: #d8b26c; background: rgba(216, 178, 108, 0.25); transform: scale(1.06); }
</style>

<div class="tp-fixed-tools">
  <button class="tp-tool-btn" id="tp-back-fixed-generic" onclick="window.location.href='index.html#tp-menu';">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>ORQAGA</span>
  </button>
  <button class="tp-tool-btn is-active" data-lang="uz">UZ</button>
  <button class="tp-tool-btn" data-lang="ru">RU</button>
  <button class="tp-tool-btn" data-lang="en">EN</button>
  <a href="index.html" class="tp-tool-icon" title="Bosh Menyu">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
  </a>
</div>


<script>
document.querySelectorAll('.tp-tool-btn[data-lang]').forEach(function(btn) {
  btn.onclick = function() {
    var l = btn.getAttribute('data-lang');
    document.querySelectorAll('.tp-tool-btn[data-lang]').forEach(function(b){ b.classList.remove('is-active'); });
    btn.classList.add('is-active');
    if (window.setLang) window.setLang(l);
    var chip = document.querySelector('.road-tech-chip[data-lang="' + l + '"]');
    if (chip) chip.click();
    var pill = document.querySelector('.tp-pill[data-lang="' + l + '"]');
    if (pill) pill.click();
  };
});
</script>

<!-- bind_lang_script_injected -->
</body>
</html>
