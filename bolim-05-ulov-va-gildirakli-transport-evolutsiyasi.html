<style>
/* =========================================================================
   ULOV VA G'ILDIRAKLI TRANSPORT EVOLUTSIYASI (SECTION 5) - 4K ULTRA HD
   ========================================================================= */
html.trans-evo-host {
  font-size: clamp(16px, calc(0.65vw + 0.65vh), 38px);
}
html.trans-evo-host, body.trans-evo-host {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #070d18; overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  font-family: "Segoe UI", Tahoma, Verdana, "Helvetica Neue", sans-serif;
  color: #dfd4bf;
}

:root {
  --te-gold: #d8b26c;
  --te-gold-bright: #f3e2b8;
  --te-gold-dark: #b98f45;
  --te-bg-dark: #070d18;
  --te-bg-card: rgba(16, 31, 56, 0.85);
  --te-border: rgba(212, 175, 110, 0.35);
  --te-text: #e9dcc4;
  --te-muted: rgba(233, 220, 196, 0.65);
  --te-serif: "Trajan Pro", "Palatino Linotype", Georgia, serif;
}

/* Background */
.te-bg {
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(circle at 50% 20%, rgba(22, 41, 74, 0.85) 0%, rgba(7, 13, 24, 0.95) 70%, #050912 100%);
}
.te-bg__grid {
  position: absolute; inset: 0; opacity: 0.05;
  background-image: linear-gradient(rgba(212,175,110,0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(212,175,110,0.4) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Container */
.te-container {
  display: flex; flex-direction: column; min-height: 100vh;
  box-sizing: border-box; width: 100%; max-width: 2800px; margin: 0 auto;
  padding-bottom: 7rem;
}

/* Header */
.te-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.2rem 3rem;
  background: linear-gradient(135deg, rgba(16, 31, 56, 0.85) 0%, rgba(11, 22, 40, 0.7) 100%);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--te-border);
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); flex: 0 0 auto;
}
.te-header__left { display: flex; align-items: center; gap: 1.8rem; }
.te-header__logo { width: 5.2rem; height: auto; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }
.te-header__title {
  font-family: var(--te-serif); font-size: 1.8rem; letter-spacing: 0.18em;
  color: var(--te-gold-bright); text-transform: uppercase; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}
.te-header__sub { font-size: 0.95rem; letter-spacing: 0.15em; color: var(--te-muted); text-transform: uppercase; margin-top: 0.2rem; }

/* Navigation Tabs */
.te-nav {
  display: flex; gap: 1rem; padding: 1.2rem 3rem 0.5rem; justify-content: center; flex-wrap: wrap;
  flex: 0 0 auto;
}
.te-tab {
  display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 1.8rem;
  background: rgba(16, 31, 56, 0.5); border: 1px solid var(--te-border); border-radius: 1.2rem;
  color: var(--te-muted); font-size: 1.15rem; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; transition: all 0.3s cubic-bezier(0.2,0.9,0.3,1);
}
.te-tab__num {
  font-family: var(--te-serif); font-weight: 700; color: var(--te-gold); font-size: 1.2rem;
  width: 2.2rem; height: 2.2rem; border-radius: 50%; border: 1px solid var(--te-border);
  display: flex; align-items: center; justify-content: center; background: rgba(7,13,24,0.6);
}
.te-tab.is-active {
  background: linear-gradient(135deg, rgba(22, 41, 74, 0.9) 0%, rgba(16, 31, 56, 0.95) 100%);
  border-color: var(--te-gold); color: var(--te-gold-bright);
  box-shadow: 0 6px 20px rgba(0,0,0,0.4), inset 0 0 15px rgba(216,178,108,0.2);
  transform: translateY(-2px);
}
.te-tab.is-active .te-tab__num { background: var(--te-gold); color: #070d18; border-color: transparent; }

/* Vertical Stage (Photo Top -> Description Below) */
.te-stage {
  flex: 1; display: flex; flex-direction: column; gap: 1.8rem;
  padding: 1.2rem 3rem 2rem; box-sizing: border-box;
}

/* Photo / Visual Container */
.te-visual-card {
  position: relative; background: var(--te-bg-card); border: 1px solid var(--te-border);
  border-radius: 1.8rem; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 16px 40px rgba(0,0,0,0.6); min-height: 380px; align-items: center; justify-content: center;
}
.te-visual-card__badge {
  position: absolute; top: 1.5rem; left: 1.5rem; z-index: 2;
  background: rgba(7, 13, 24, 0.85); border: 1px solid var(--te-gold-dark);
  padding: 0.5rem 1.4rem; border-radius: 0.8rem; font-family: var(--te-serif);
  font-size: 1.1rem; color: var(--te-gold-bright); letter-spacing: 0.15em; text-transform: uppercase;
}
.te-svg-stage { width: 100%; height: 100%; max-height: 420px; filter: drop-shadow(0 10px 25px rgba(0,0,0,0.7)); }

/* Description Card Right Below Photo */
.te-desc-card {
  background: var(--te-bg-card); border: 1px solid var(--te-border);
  border-radius: 1.8rem; padding: 2.2rem; display: flex; flex-direction: column;
  gap: 1.4rem; box-shadow: 0 16px 40px rgba(0,0,0,0.6);
}
.te-desc-card__title {
  font-family: var(--te-serif); font-size: 2.2rem; color: var(--te-gold-bright);
  line-height: 1.25; letter-spacing: 0.08em; text-transform: uppercase;
  border-bottom: 1px solid var(--te-border); padding-bottom: 0.8rem; margin: 0;
}
.te-desc-card__text { font-size: 1.3rem; line-height: 1.75; color: var(--te-text); margin: 0; }
.te-desc-card__text p { margin: 0 0 1rem 0; }

.te-stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4rem; margin-top: 0.8rem;
  padding-top: 1.2rem; border-top: 1px solid rgba(212,175,110,0.2);
}
@media (max-width: 900px) { .te-stats { grid-template-columns: repeat(2, 1fr); } }

.te-stat-card {
  background: rgba(7, 13, 24, 0.7); border: 1px solid var(--te-border);
  border-radius: 1rem; padding: 1.1rem 1.4rem;
}
.te-stat-card__lbl { font-size: 0.95rem; color: var(--te-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.te-stat-card__val { font-family: var(--te-serif); font-size: 1.45rem; color: var(--te-gold); font-weight: 700; margin-top: 0.3rem; }

/* Controller Bar */
.te-controls {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1rem 3rem 1.5rem; flex: 0 0 auto;
}
.te-ctrl-btn {
  display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 2rem;
  background: rgba(16, 31, 56, 0.8); border: 1px solid var(--te-border); border-radius: 1rem;
  color: var(--te-gold-bright); font-size: 1.15rem; letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
}
.te-ctrl-btn:hover {
  background: linear-gradient(180deg, var(--te-gold-bright), var(--te-gold-dark));
  color: #070d18; border-color: transparent; transform: scale(1.03);
}
.te-progress { display: flex; align-items: center; gap: 1rem; width: 40%; max-width: 600px; }
.te-progress__bar { flex: 1; height: 8px; background: rgba(212,175,110,0.2); border-radius: 4px; overflow: hidden; }
.te-progress__fill { height: 100%; width: 20%; background: linear-gradient(90deg, var(--te-gold-dark), var(--te-gold-bright)); transition: width 0.4s ease; }
.te-progress__text { font-family: var(--te-serif); font-size: 1.2rem; color: var(--te-gold); font-weight: 700; }

/* Fixed Bottom Center Toolbar */
.tp-fixed-tools {
  position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 9999;
  display: flex; align-items: center; justify-content: center; gap: 1.2rem;
  padding: 0.7rem 1.8rem; background: rgba(11, 21, 38, 0.88);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(212, 175, 110, 0.45); border-radius: 1.2rem;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(216, 178, 108, 0.25);
}
.tp-tool-btn {
  padding: 0.65rem 1.5rem; border: 1px solid rgba(212, 175, 110, 0.35); border-radius: 0.7rem;
  font-size: 1.1rem; letter-spacing: 0.15em; text-transform: uppercase; color: #e9dcc4;
  background: rgba(16, 31, 56, 0.7); cursor: pointer; transition: all 0.25s;
  display: flex; align-items: center; gap: 0.6rem; text-decoration: none;
}
.tp-tool-btn:hover, .tp-tool-btn.is-active {
  color: #070d18; background: linear-gradient(180deg, var(--te-gold-bright), var(--te-gold-dark));
  border-color: transparent; font-weight: 700; box-shadow: 0 4px 16px rgba(216, 178, 108, 0.4);
}
.tp-tool-icon {
  width: 3.6rem; height: 3.6rem; border: 1px solid rgba(212, 175, 110, 0.35); border-radius: 0.7rem;
  display: flex; align-items: center; justify-content: center; background: rgba(16, 31, 56, 0.7);
  cursor: pointer; transition: all 0.25s; text-decoration: none;
}
.tp-tool-icon svg { width: 2rem; height: 2rem; stroke: var(--te-gold); fill: none; stroke-width: 2; }
.tp-tool-icon:hover { border-color: var(--te-gold); background: rgba(216, 178, 108, 0.2); transform: scale(1.05); }

@media (min-width: 2500px) {
  html.trans-evo-host { font-size: 28px; }
  .te-container { max-width: 3600px; }
}
</style>

    desc_uz: "<p>Qadimgi insoniyat tarixida yuklarni inson o'z yelkasida yoki qo'lida tashishi masofa va og'irlik jihatdan cheklangan edi. Jamiyat, dehqonchilik va savdo rivojlangani sari katta hajmdagi mahsulotlarni, toshlar, don va qurilish materiallarini uzoq masofalarga yetkazish uchun yangi mexanizmlar va ulov hayvonlariga ehtiyoj tug'ildi.</p><p>Dastlab sudrash vositalari (shatllar, yog'och sudragichlar) hamda daryo oqimlari bo'ylab sol (raft) va qayiqlar ishlatilgan. Keyinchalik esa hayvonlarni xonakilashtirish transport evolutsiyasining birinchi tub burilishiga olib keldi.</p>",
    desc_ru: "<p>На ранних этапах истории человечества переноска грузов людьми ограничивала объемы и расстояния. С развитием земледелия и торговли возникла острая необходимость в эффективном транспорте.</p><p>Первыми приспособлениями стали волокуши и плоты, а главным прорывом стало одомашнивание животных.</p>",

/* APP ENGINE */
(function() {
  var lang = 'uz';
  var currentIndex = 0;

  var $ = function(id) { return document.getElementById(id); };

  function renderTabs() {
    var tabsEl = $('te-tabs');
    tabsEl.innerHTML = '';
    DATA.forEach(function(item, idx) {
      var btn = document.createElement('button');
      btn.className = 'te-tab' + (idx === currentIndex ? ' is-active' : '');
      var badgeText = item['badge_' + lang] || item.badge_uz;
      btn.innerHTML = '<span class="te-tab__num">' + item.id + '</span><span>' + badgeText + '</span>';
      btn.onclick = function() {
        currentIndex = idx;
        updateSlide();
      };
      tabsEl.appendChild(btn);
    });
  }

  function updateSlide() {
    var d = DATA[currentIndex];
    $('te-badge').textContent = d['badge_' + lang] || d.badge_uz;
    $('te-title').textContent = d['title_' + lang] || d.title_uz;
    $('te-desc').innerHTML = d['desc_' + lang] || d.desc_uz;
    $('te-visual').innerHTML = d.svg;

    var statsEl = $('te-stats');
    statsEl.innerHTML = '';
    d.stats.forEach(function(st) {
      var lbl = st['label_' + lang] || st.label_uz;
      var card = document.createElement('div');
      card.className = 'te-stat-card';
      card.innerHTML = '<div class="te-stat-card__lbl">' + lbl + '</div><div class="te-stat-card__val">' + st.val + '</div>';
      statsEl.appendChild(card);
    });

    $('te-progress-text').textContent = (currentIndex + 1) + ' / ' + DATA.length;
    $('te-progress-fill').style.width = ((currentIndex + 1) / DATA.length * 100) + '%';

    renderTabs();
  }

  // Fixed Language pills
  document.querySelectorAll('.tp-tool-btn[data-lang]').forEach(function(btn) {
    btn.onclick = function() {
      document.querySelectorAll('.tp-tool-btn[data-lang]').forEach(function(b){ b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      lang = btn.getAttribute('data-lang');
      updateSlide();
    };
  });

  // Fixed Back Button
  $('tp-back-fixed-5').onclick = function() {
    window.location.href = 'index.html#tp-menu';
  };

  // Prev / Next Buttons
  $('te-prev-btn').onclick = function() {
    currentIndex = (currentIndex - 1 + DATA.length) % DATA.length;
    updateSlide();
  };
  $('te-next-btn').onclick = function() {
    currentIndex = (currentIndex + 1) % DATA.length;
    updateSlide();
  };

  updateSlide();
})();
</script>
